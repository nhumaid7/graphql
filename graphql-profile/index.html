<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>graphql</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <symbol id="bloom-unit" viewBox="0 0 40 40">
                <g>
                    <ellipse cx="20" cy="8" rx="6" ry="10"/>
                    <ellipse cx="20" cy="8" rx="6" ry="10" transform="rotate(60 20 20)"/>
                    <ellipse cx="20" cy="8" rx="6" ry="10" transform="rotate(120 20 20)"/>
                    <ellipse cx="20" cy="8" rx="6" ry="10" transform="rotate(180 20 20)"/>
                    <ellipse cx="20" cy="8" rx="6" ry="10" transform="rotate(240 20 20)"/>
                    <ellipse cx="20" cy="8" rx="6" ry="10" transform="rotate(300 20 20)"/>
                </g>
                <circle cx="20" cy="20" r="5" fill="var(--gold)"/>
            </symbol>
        </defs>
    </svg>

    <div class="botanical-decor" aria-hidden="true">
        <svg class="falling-flower" style="--x:3%; --size:14px; --duration:12s; --delay:-2s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--dusty-pink)"/></svg>
        <svg class="falling-flower" style="--x:9%; --size:22px; --duration:16s; --delay:-7s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--baby-blue)"/></svg>
        <svg class="falling-flower" style="--x:15%; --size:12px; --duration:10s; --delay:-1s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--lavender)"/></svg>
        <svg class="falling-flower" style="--x:21%; --size:26px; --duration:18s; --delay:-11s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--sage)"/></svg>
        <svg class="falling-flower" style="--x:27%; --size:16px; --duration:13s; --delay:-4s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--blush-rose)"/></svg>
        <svg class="falling-flower" style="--x:33%; --size:20px; --duration:15s; --delay:-9s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--gold-light)"/></svg>
        <svg class="falling-flower" style="--x:39%; --size:13px; --duration:11s; --delay:-3s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--dusty-pink)"/></svg>
        <svg class="falling-flower" style="--x:45%; --size:24px; --duration:17s; --delay:-6s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--baby-blue)"/></svg>
        <svg class="falling-flower" style="--x:51%; --size:15px; --duration:9s; --delay:-2s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--lavender)"/></svg>
        <svg class="falling-flower" style="--x:57%; --size:28px; --duration:19s; --delay:-13s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--sage)"/></svg>
        <svg class="falling-flower" style="--x:63%; --size:17px; --duration:12s; --delay:-5s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--blush-rose)"/></svg>
        <svg class="falling-flower" style="--x:69%; --size:21px; --duration:14s; --delay:-8s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--gold-light)"/></svg>
        <svg class="falling-flower" style="--x:75%; --size:12px; --duration:10s; --delay:-1s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--dusty-pink)"/></svg>
        <svg class="falling-flower" style="--x:81%; --size:25px; --duration:16s; --delay:-10s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--baby-blue)"/></svg>
        <svg class="falling-flower" style="--x:87%; --size:14px; --duration:11s; --delay:-3s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--lavender)"/></svg>
        <svg class="falling-flower" style="--x:93%; --size:23px; --duration:18s; --delay:-12s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--sage)"/></svg>
        <svg class="falling-flower" style="--x:6%; --size:18px; --duration:13s; --delay:-6s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--blush-rose)"/></svg>
        <svg class="falling-flower" style="--x:18%; --size:15px; --duration:9s; --delay:-2s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--gold-light)"/></svg>
        <svg class="falling-flower" style="--x:44%; --size:12px; --duration:10s; --delay:-4s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--dusty-pink)"/></svg>
        <svg class="falling-flower" style="--x:72%; --size:19px; --duration:15s; --delay:-7s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--baby-blue)"/></svg>
        <svg class="falling-flower" style="--x:96%; --size:13px; --duration:11s; --delay:-5s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--lavender)"/></svg>
        <svg class="falling-flower" style="--x:60%; --size:27px; --duration:20s; --delay:-14s" viewBox="0 0 40 40"><use href="#bloom-unit" fill="var(--sage)"/></svg>
    </div>

    <div class="page auth-page">
        <div class="auth-card">
            <div class="seal" aria-hidden="true">✿</div>
            <h1>GraphQL Profile</h1>
            <p class="tagline">A dreamy record of your learning journey</p>

            <form id="login-form" class="auth-form">
                <label for="username">Username or Email</label>
                <input type="text" name="username" id="username" placeholder="Username or Email" required>
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" name="password" id="password" placeholder="Password" required>
                    <button type="button" id="toggle-password" class="eye-toggle" aria-label="Show password">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3l18 18"/>
                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                            <path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c7 0 11 7 11 7a13.2 13.2 0 0 1-3.4 4"/>
                            <path d="M6.1 6.1C3.4 7.9 1 12 1 12a13.2 13.2 0 0 0 5.4 5.4"/>
                        </svg>
                    </button>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <p id="error-message"></p>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
